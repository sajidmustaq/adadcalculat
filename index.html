<!DOCTYPE html>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }

        h1 { text-align: center; color: #1a5276; margin-bottom: 20px; }
        
        /* Tab Navigation Styling */
        .tab-buttons { display: flex; justify-content: center; margin-bottom: 25px; gap: 10px; }
        .tab-btn { padding: 12px 30px; font-size: 18px; border: none; background-color: #e5e7e9; color: #333; cursor: pointer; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background-color: #1a5276; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Calculator Section */
        .calculator-box { background: #ebf5fb; padding: 25px; border-radius: 8px; text-align: center; }
        input[type="text"] { width: 80%; padding: 12px; font-size: 18px; border: 2px solid #aed6f1; border-radius: 6px; text-align: center; margin-bottom: 15px; }
        button.action-btn { padding: 12px 25px; font-size: 16px; background-color: #1a5276; color: white; border: none; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        button.action-btn:hover { background-color: #117864; }
        .result { font-size: 20px; font-weight: bold; margin-top: 15px; color: #117864; }
        .letters-breakdown { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 15px; direction: rtl; }
        .letter-box { background: #fff; border: 2px solid #aed6f1; border-radius: 8px; padding: 10px; min-width: 50px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .letter-char { font-size: 22px; font-weight: bold; color: #1a5276; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-bottom: 5px; }
        .letter-val { font-size: 16px; color: #e67e22; font-weight: bold; }
        .ism-azam-box { margin-top: 20px; padding: 15px; background: #e8f8f5; border: 1px solid #a3e4d7; border-radius: 8px; text-align: right; }
        .ism-azam-box h3 { margin-top: 0; color: #117864; text-align: center; }
        
        /* 99 Names Table Styling */
        .search-box { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #aed6f1; border-radius: 6px; font-size: 16px; text-align: right; }
        .table-container { max-height: 500px; overflow-y: auto; overflow-x: auto; border: 1px solid #ddd; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; }
        th { background-color: #1a5276; color: white; position: sticky; top: 0; }
        tr:hover { background-color: #f2f2f2; }
        ul { margin: 5px 0; padding-right: 20px; }
        
        /* Responsive Styling */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            .tab-buttons { flex-direction: column; }
            .tab-btn { width: 100%; padding: 12px; font-size: 16px; margin-bottom: 5px; }
            input[type="text"] { width: 100%; }
            th, td { padding: 8px; font-size: 14px; }
            .action-btn { width: 100%; }
            .result { font-size: 18px; }
            .ism-azam-box { text-align: center; }
            ul { padding-right: 0; list-style-type: none; }
        }
    </style>
</head>

    document.getElementById(tabId).classList.add('active');
    btnElement.classList.add('active');
}

// Helper: normalize Arabic/Urdu text (remove diacritics, normalize similar letters)
function normalizeArabic(text) {
    if (!text) return '';
    // remove tashkeel/diacritics and tatweel and LTR/RLT marks
    let t = text.replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640\u200E\u200F]/g, '');
    // map variants to forms used in abjadMap
    t = t.replace(/[أإٱآ]/g, 'ا')
         .replace(/ي/g, 'ی')
         .replace(/ى/g, 'ی')
         .replace(/ك/g, 'ک')
         .replace(/ه/g, 'ہ')
         .replace(/ة/g, 'ہ')
         .replace(/[ؤ]/g, 'و')
         .replace(/ئ/g, 'ی')
         .replace(/ٰ/g, ''); // remove superscript alif
    return t;
}

function computeValue(text) {
    const normalized = normalizeArabic(text);
    let total = 0;
    for (let ch of normalized) {
        if (abjadMap[ch]) total += abjadMap[ch];
    }
    return total;
}

// 3. Calculator Function
function calculateAbjad() {
    const text = document.getElementById('userInput').value;
    let total = 0;
    let breakdownHtml = '';

    const normalized = normalizeArabic(text);

    for (let char of normalized) {
        if (char.trim() === '') continue; // فاصلے (spaces) کو نظر انداز کریں
        if (abjadMap[char]) {
            const val = abjadMap[char];
            total += val;
            breakdownHtml += `<div class="letter-box">
                <div class="letter-char">${char}</div>
                <div class="letter-val">${val}</div>
            </div>`;
        }
    }
    
    document.getElementById('lettersBreakdown').innerHTML = breakdownHtml;
    document.getElementById('resultArea').innerText = `نام کے کل اعداد: ${total}`;
    
    if (total > 0) {
        findIsmAzam(total);
    } else {
        document.getElementById('ismAzamBox').style.display = 'none';
    }
}

// 4. Ism-e-Azam Logic
function findIsmAzam(nameTotal) {
    // اب ہم ڈبل نہیں کر رہے؛ ہدف وہی ہے جو کل اعداد ہیں
    const target = nameTotal;
    const MAX_COMBINATIONS_PER_LEVEL = 20; // limit per group
    const MAX_NAMES = 5;
    const MAX_ITERATIONS = 100000; // پرفارمنس کے لیے لوپ کی حد

    // Pruning کے لیے ناموں کو اعداد کے لحاظ سے ترتیب دیں
    const sortedNames = [...allahNames].sort((a, b) => a.value - b.value);
    
    const matchesByCount = {};

    for (let count = 1; count <= MAX_NAMES; count++) {
        const currentLevelMatches = [];
        let iterations = 0;
        
        function findCombinations(startIdx, currentSum, currentCombo) {
            if (iterations > MAX_ITERATIONS) return;
            if (currentLevelMatches.length >= MAX_COMBINATIONS_PER_LEVEL) return;
            
            if (currentCombo.length === count) {
                if (currentSum === target) {
                    currentLevelMatches.push([...currentCombo]);
                }
                return;
            }
            
            for (let i = startIdx; i < sortedNames.length; i++) {
                iterations++;
                
                if (currentSum + sortedNames[i].value > target) {
                    break; 
                }
                
                currentCombo.push(sortedNames[i]);
                findCombinations(i + 1, currentSum + sortedNames[i].value, currentCombo);
                currentCombo.pop();
            }
        }
        
        findCombinations(0, 0, []);
        if (currentLevelMatches.length > 0) {
            matchesByCount[count] = currentLevelMatches;
        }
    }

    const ismBox = document.getElementById('ismAzamBox');
    const ismDetails = document.getElementById('ismAzamDetails');
    ismBox.style.display = 'block';

    let html = `<p>مطلوبہ ہدف اعداد: <b>${target}</b></p>`;

    let foundAny = false;
    const numberLabels = {
        1: 'سنگل اسمِ مبارک',
        2: 'دو اسماء کا مجموعہ',
        3: 'تین اسماء کا مجموعہ',
        4: 'چار اسماء کا مجموعہ',
        5: 'پانچ اسماء کا مجموعہ'
    };

    for (let count = 1; count <= MAX_NAMES; count++) {
        if (matchesByCount[count] && matchesByCount[count].length > 0) {
            foundAny = true;
            let label = numberLabels[count] || `${count} اسماء کا مجموعہ`;
            html += `<p><b>${label} (${matchesByCount[count].length}${matchesByCount[count].length >= MAX_COMBINATIONS_PER_LEVEL ? '+' : ''} ملے):</b></p><ul>`;
            
            matchesByCount[count].forEach(combo => {
                const namesStr = combo.map(item => {
                    let n = item.name;
                    if (n.match(/^ال[ْ]?/)) {
                        n = n.replace(/^ال[ْ]?/, 'یا ');
                    } else {
                        n = 'یا ' + n;
                    }
                    return `<b>${n}</b>`;
                }).join(' ');
                
                html += `<li>${namesStr}</li>`;
            });
            html += `</ul>`;
        }
    }

    if (!foundAny) {
        html += `<p style="color: #c0392b;">اس عدد (${target}) کے مطابق کوئی اسم یا مجموعہ نہیں ملا (زیادہ سے زیادہ ${MAX_NAMES} اسماء تک تلاش کی گئی).</p>`;
    } else {
        html += `<p style="color: #1a5276; font-size: 14px; margin-top: 10px;">(نوٹ: براؤزر کی کارکردگی محفوظ رکھنے کے لیے ہر کیٹیگری میں نتائج محدود کیے گئے ہیں.)</p>`;
    }

    ismDetails.innerHTML = html;
}

// 5. Populate Asma-ul-Husna Table
function renderNamesTable(data) {
    const tbody = document.getElementById('namesTableBody');
    tbody.innerHTML = '';
    data.forEach(item => {
        const row = `<tr>
            <td>${item.id}</td>
            <td><b>${item.name}</b></td>
            <td>${item.translation}</td>
            <td><b>${item.value}</b></td>
        </tr>`;
        tbody.innerHTML += row;
    });
}

// 6. Advanced Search Function (Search by Name, Translation or Numbers)
function filterNames() {
    const queryRaw = document.getElementById('searchName').value.trim();
    const query = queryRaw.toLowerCase();
    const normalizedQuery = normalizeArabic(queryRaw);

    const filtered = allahNames.filter(item => {
        const nameNorm = normalizeArabic(item.name);
        const nameMatch = normalizedQuery !== '' && nameNorm.includes(normalizedQuery);
        const translationMatch = query !== '' && item.translation.toLowerCase().includes(query);
        const valueMatch = item.value.toString().includes(query);
        const idMatch = item.id.toString() === query;

        // If query is empty, show all
        if (query === '' && normalizedQuery === '') return true;

        return nameMatch || translationMatch || valueMatch || idMatch;
    });
    renderNamesTable(filtered);
}

// 7. Render Abjad Chart
function renderAbjadChart() {
    const grid = document.getElementById('abjadChartGrid');
    let html = '';
    
    // ہم صرف منفرد اور بنیادی حروف دکھائیں گے تاکہ چارٹ خوبصورت اور پڑھنے میں آسان ہو
    const displayChars = [
        'ا', 'ب', 'ج', 'د', 'ہ', 'و', 'ز', 'ح', 'ط', 'ی', 
        'ک', 'ل', 'م', 'ن', 'س', 'ع', 'ف', 'ص', 'ق', 'ر', 
        'ش', 'ت', 'ث', 'خ', 'ذ', 'ض', 'ظ', 'غ',
        'پ', 'چ', 'ڈ', 'ڑ', 'ژ', 'گ', 'ٹ', 'ے', 'ں'
    ];
    
    displayChars.forEach(char => {
        if (abjadMap[char]) {
            html += `<div class="letter-box">
                <div class="letter-char">${char}</div>
                <div class="letter-val">${abjadMap[char]}</div>
            </div>`;
        }
    });
    
    grid.innerHTML = html;
}

// Initial Render
renderNamesTable(allahNames);
renderAbjadChart();
